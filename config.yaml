version: "6.3.0-ru.1"
slug: configurator_ru
name: File editor — русский
description: Русская версия браузерного редактора файлов Home Assistant
url: https://github.com/leoservis/home-assistant-file-editor-ru
arch:
  - amd64
homeassistant: 0.91.1
homeassistant_api: true
ingress: true
init: false
map:
  - all_app_configs:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:rw
options:
  dirsfirst: false
  enforce_basepath: true
  git: true
  ignore_pattern:
    - __pycache__
    - .cloud
    - .storage
    - deps
  log_level: info
  ssh_keys: []
panel_icon: mdi:wrench
schema:
  dirsfirst: bool
  enforce_basepath: bool
  git: bool
  ignore_pattern:
    - str
  log_level: list(debug|info|warning|error|critical)?
  ssh_keys:
    - str
