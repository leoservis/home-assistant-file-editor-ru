configuration:
  dirsfirst:
    name: Сначала папки
    description: Показывать папки перед файлами в дереве файлов.
  enforce_basepath:
    name: Ограничить доступ папкой конфигурации
    description: Если включено, доступ будет ограничен файлами в папке `/config`.
  git:
    name: Git
    description: Инициализировать Git в папках, где это возможно.
  ignore_pattern:
    name: Исключаемые файлы и папки
    description: Скрывать указанные файлы и папки в дереве файлов.
  log_level:
    name: Уровень журнала
    description: Определяет подробность журнала редактора файлов.
  ssh_keys:
    name: SSH-ключи
    description: Список файлов с закрытыми SSH-ключами для доступа к удалённым Git-репозиториям.
